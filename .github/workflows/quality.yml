name: Code quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
        env:
          NOTION_API_KEY: 'ci-placeholder'
          NOTION_DATA_SOURCE_ID: '00000000-0000-0000-0000-000000000000'
      - run: npx tsc --noEmit
